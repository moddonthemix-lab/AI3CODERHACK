<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder Dashboard</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#273040; --fg:#e6edf3; --dim:#8b97a7;
          --accent:#4dff9e; --high:#ff6b6b; --med:#ffb454; --low:#f2e55c; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 ui-sans-serif,system-ui,sans-serif;
         padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left)); }
  h1 { font-size:20px; margin:0 0 2px; } h1 b { color:var(--accent); }
  .sub { color:var(--dim); margin:0 0 16px; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .pill { border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px; color:var(--dim); }
  .pill b { color:var(--fg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .tile .n { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tile .l { color:var(--dim); font-size:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:14px; margin:0 0 10px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .rev { border-top:1px solid var(--line); padding:9px 0; }
  .rev:first-of-type { border-top:0; }
  .sev { font-size:11px; font-weight:700; padding:1px 7px; border-radius:5px; margin-right:8px; }
  .sev.high { background:rgba(255,107,107,.15); color:var(--high); }
  .sev.med { background:rgba(255,180,84,.15); color:var(--med); }
  .sev.low { background:rgba(242,229,92,.12); color:var(--low); }
  .fix { color:var(--dim); font-size:13px; margin:3px 0 0 42px; }
  input,button { font:inherit; }
  #q { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--fg); padding:10px 12px; }
  button { background:var(--accent); color:#04150c; border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; }
  #reply { white-space:pre-wrap; margin-top:10px; color:var(--fg); }
  .empty { color:var(--dim); }
</style>
</head>
<body>
  <h1>🛠️ <b>Builder</b></h1>
  <p class="sub">Coder &amp; security engineer · <span id="status">connecting…</span></p>
  <div class="pills" id="pills"></div>

  <div class="grid" id="tiles"></div>

  <div class="panel">
    <h2>Build something</h2>
    <input id="btask" placeholder="What should he build? e.g. a retro snake game with a test">
    <div style="display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap">
      <span style="color:var(--dim); font-size:13px">folder name:</span>
      <input id="bdir" placeholder="snake" style="flex:1; min-width:120px">
      <button onclick="build()" id="bbtn">Build it</button>
    </div>
    <div style="color:var(--dim); font-size:12px; margin-top:6px" id="bspace"></div>
    <div id="bout" style="white-space:pre-wrap; margin-top:10px; font-family:ui-monospace,monospace; font-size:13px"></div>
  </div>

  <div class="panel">
    <h2>Ask Builder</h2>
    <input id="q" placeholder="Ask a coding or security question…">
    <div style="margin-top:10px"><button onclick="ask()">Ask</button></div>
    <div id="reply"></div>
  </div>

  <div class="panel">
    <h2>Recent security findings</h2>
    <div id="reviews"><span class="empty">none yet — run <code>builder review &lt;path&gt;</code></span></div>
  </div>

  <div class="panel">
    <h2>Projects he's built</h2>
    <div id="builds"><span class="empty">none yet — run <code>builder build "…" --dir ~/Projects/x</code></span></div>
  </div>

<script>
const $ = id => document.getElementById(id);
let TOKEN = "";
try { TOKEN = localStorage.getItem("builder_token") || ""; } catch (e) {}
async function api(path, opts) {
  const o = opts || {}; o.headers = o.headers || {};
  if (TOKEN) o.headers["Authorization"] = "Bearer " + TOKEN;
  const r = await fetch(path, o);
  if (r.status === 401) {
    try { TOKEN = prompt("Builder API token (BUILDER_API_TOKEN):") || ""; localStorage.setItem("builder_token", TOKEN); } catch (e) {}
    return api(path, opts);
  }
  return r.json();
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

async function refresh() {
  try {
    const b = await api("/api/brief");
    SPACE = b.space || "";
    $("bspace").textContent = SPACE ? ("will build in: " + SPACE + "/<folder name>") : "⚠ no workspace set — add BUILDER_CODE_DIRS to your .env";
    $("status").textContent = (b.online === false ? "offline" : "online") + " · " + (b.lab_targets ? "lab mode ON" : "defensive mode");
    $("pills").innerHTML =
      `<span class="pill"><b>${b.reviews}</b> findings</span>` +
      `<span class="pill" style="color:var(--high)"><b>${b.high}</b> high</span>` +
      `<span class="pill"><b>${b.lessons}</b> lessons</span>` +
      (b.pending ? `<span class="pill"><b>${b.pending}</b> pending</span>` : "") +
      (b.unread ? `<span class="pill">✉ ${b.unread} new</span>` : "");
    const s = await api("/api/stats");
    const sv = s.reviews_by_severity || { high: 0, med: 0, low: 0 };
    const tiles = [["High", sv.high], ["Medium", sv.med], ["Low", sv.low],
                   ["Built OK", (s.builds_passed || 0) + "/" + (s.builds || 0)], ["Lessons", s.lessons], ["Lab targets", s.lab_targets]];
    $("tiles").innerHTML = tiles.map(([l, n]) => `<div class="tile"><div class="n">${n || 0}</div><div class="l">${l}</div></div>`).join("");
    const rv = await api("/api/reviews?limit=25");
    $("reviews").innerHTML = rv.length ? rv.map(r =>
      `<div class="rev"><span class="sev ${r.severity}">${r.severity.toUpperCase()}</span>${esc(r.issue)}` +
      (r.fix ? `<div class="fix">fix: ${esc(r.fix)}</div>` : "") + `</div>`).join("")
      : `<span class="empty">none yet — run <code>builder review &lt;path&gt;</code></span>`;
    const bl = await api("/api/builds?limit=20");
    $("builds").innerHTML = bl.length ? bl.map(b =>
      `<div class="rev"><span class="sev ${b.ok ? "low" : "high"}">${b.ok ? "PASS" : "FAIL"}</span>${esc(b.task)}` +
      `<span style="color:var(--dim)"> · ${b.attempts} tr${b.attempts === 1 ? "y" : "ies"}</span>` +
      (b.problem ? `<div class="fix">problem solved: ${esc(b.problem)}</div>` : "") + `</div>`).join("")
      : `<span class="empty">none yet — run <code>builder build "…" --dir ~/Projects/x</code></span>`;
  } catch (e) {
    $("status").textContent = "can't reach Builder";
  }
}
async function ask() {
  const text = $("q").value.trim(); if (!text) return;
  $("reply").textContent = "thinking…";
  try {
    const r = await api("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    $("reply").textContent = r.reply || r.error || "(no reply)";
  } catch (e) { $("reply").textContent = "error: " + e; }
}
let SPACE = "";
async function build() {
  const task = $("btask").value.trim();
  let name = $("bdir").value.trim();
  if (!task) { $("bout").textContent = "Tell him what to build first."; return; }
  if (!SPACE) { $("bout").textContent = "No workspace set. Put BUILDER_CODE_DIRS=~/BuilderSpace in your .env and restart."; return; }
  if (!name) name = task.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "project";
  const dir = SPACE.replace(/\/+$/, "") + "/" + name;
  $("bbtn").disabled = true;
  $("bout").textContent = "Building in " + dir + " …\nThis runs the local model and the tests — it can take a few minutes on a CPU. Leave this open.";
  try {
    const r = await api("/api/build", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ task, dir }) });
    if (r.error) { $("bout").textContent = "✗ " + r.error; }
    else {
      $("bout").textContent = (r.ok ? "✓ tests pass" : "✗ tests still failing") + " after " + r.attempts +
        " attempt(s) in " + r.dir + "\n\n" + (r.diff || "(no changes)");
      refresh();
    }
  } catch (e) { $("bout").textContent = "error: " + e; }
  $("bbtn").disabled = false;
}
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
$("btask").addEventListener("keydown", e => { if (e.key === "Enter") build(); });
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
