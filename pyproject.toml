[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "builder"
version = "0.1.0"
description = "Builder — the coder & security engineer of the AI family: builds and tests things, and defends your own systems. Runs locally on Ollama."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # core runs on the standard library + Ollama

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24", "soundfile>=0.12", "piper-tts>=1.2"]
cloud = ["anthropic>=0.40"]                          # family cloud brain (Claude); local mode needs nothing
dev = ["pytest>=8"]

[project.scripts]
builder = "builder.cli:main"

[tool.setuptools]
packages = ["builder"]
# Copied verbatim from the Family Hub repo (github.com/moddonthemix-lab/AIFAMINTERFACE).
# Do not edit these here — update by re-copying. The connector (builder/connector.py) uses them.
py-modules = ["hub_client", "family_brain"]

[tool.setuptools.package-data]
builder = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
